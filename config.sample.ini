[General]
# Full path to your root Embroidery folder (supports ~ for your home directory)
root_embroidery_directory = ~/Documents/Embroidery Thumbnails
# Full path of the embroidery folder to start scanning from (root or a specific category subfolder)
embroidery_start_directory = ~/Documents/Embroidery Thumbnails
# Output Catalog folder (leave blank to default to <root_embroidery_directory>/Catalog)
catalog_directory =
# Catalog folder(s) to exclude, separated by a comma (case-insensitive substring match)
excluded_folders = Alphabets & Monograms, Catalog, Images, Colorcharts
# Maximum number of columns in the responsive HTML grid on wide screens (must be an integer)
table_cols = 6
# Maximum number of unique deduplicated designs to include (must be an integer)
max_files = 100000
# Logging level: debug, info, warning, error, critical
log_level = info
# Set to true to force recreating all PNG thumbnails even if they already exist
recreate_images = false
# Set to true to delete all folders/files in Catalog/images/ (except K+N_favicon.svg) before rendering
clean_images = false
